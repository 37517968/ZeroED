model:
  model_type: gpt-4o-mini
  cluster_rate: 0.1
  api_use: true
  related_attrs: true
  pre_func_use: true
  func_use: true
  rel_top: 2
  label_prop: false
  iterations: 10
  initial_llm_label_iterations: 1
  initial_llm_label_consistency_threshold: 1.0
  train_high_confidence_threshold: 0.8
  mid_confidence_threshold: 0.7
  high_confidence_threshold: 0.95
  cluster_selection_window: 5
  compute_f1_per_iteration: true
  result_analyze: true
  distribution_analysis:
    enabled: true
    eps: 0.5
    max_cluster_centers: 20
    top_canonical_clusters: 2
    max_samples_per_cluster: 10
    alpha: 0.20
    beta: 0.10
    gamma: 0.10
    delta: 0.60
    min_cluster_size_for_pattern: 10
    max_patterns_to_compare: 10
    canonical_score_threshold: 0.65
    # 错误模式识别配置
    error_pattern_threshold: 0.65  # 错误模式分数阈值
    error_pattern_alpha: 0.2      # 分离度权重
    error_pattern_beta: 0.2       # 紧致度权重
    error_pattern_gamma: 0.6      # LLM对立度权重
data:
  base_dir: .
  err_rate_list:
  - '01'
  all_set_num: 1
  datasets:
  - rayyan
  # - beers
  # - hospital
  # - flights
  result_dir: results
  err_check_val_num_per_query: 20
