model:
  model_type: 'gpt-4o-mini'
  cluster_rate: 0.1
  api_use: true
  related_attrs: true
  pre_func_use: true
  func_use: true
  rel_top: 2
  label_prop: false  # 是否开启标签扩散
  iterations: 20
  initial_llm_label_iterations: 5
  initial_llm_label_consistency_threshold: 1.0
  train_high_confidence_threshold: 0.7
  mid_confidence_threshold: 0.5
  high_confidence_threshold: 0.7
  cluster_selection_window: 0  # 聚类选择窗口大小：-1表示不能选择任何选择过的聚类，0表示可以选择任意聚类，1表示不能选择上一次的聚类，2表示不能选择前两次的聚类
  compute_f1_per_iteration: true  # 是否在每次迭代中计算F1分数

data:
  base_dir: '.'
  err_rate_list: ["01"]
  all_set_num: 1
  datasets: ['test']  # ''  test
  result_dir: 'results'
  err_check_val_num_per_query: 20