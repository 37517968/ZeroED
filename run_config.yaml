model:
  model_type: gpt-4o-mini
  cluster_rate: 0.1
  api_use: true
  # 分布分析LLM配置（用于聚类描述、模式识别等）
  distribution_analysis_llm:
    api_use: true
    model_type: glm-4.7
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_keys:
      - sk-cf0f901fbe8847099502a50aa2d59ec9
  # 标注LLM配置（用于错误检测标注）
  annotation_llm:
    api_use: true
    model_type: gpt-4o-mini
    base_url: https://jeniya.cn/v1
    api_keys:
      - sk-9SSJQSfSLf7aUtfTCMhCgsxiw5deylXvOUuHtPCDDB3Sa1ds
  related_attrs: true
  pre_func_use: true
  func_use: true
  rel_top: 2
  label_prop: false
  iterations: 10
  initial_llm_label_iterations: 1
  initial_llm_label_consistency_threshold: 1.0
  train_high_confidence_threshold: 0.8
  mid_confidence_threshold: 0.7
  high_confidence_threshold: 0.95
  cluster_selection_window: 5
  compute_f1_per_iteration: true
  result_analyze: true
  distribution_analysis:
    enabled: true
    eps: 0.5
    max_cluster_centers: 20
    top_canonical_clusters: 2
    max_samples_per_cluster: 10
    alpha: 0.20
    beta: 0.10
    gamma: 0.10
    delta: 0.60
    min_cluster_size_for_pattern: 10
    max_patterns_to_compare: 10
    canonical_score_threshold: 0.65
    error_pattern_threshold: 0.65
    error_pattern_alpha: 0.2
    error_pattern_beta: 0.2
    error_pattern_gamma: 0.6

  # 从之前的运行结果中读取数据
  read_from_previous:
    enabled: false  # 是否启用读取功能
    result_folder: "./result/results/gpt-4o-mini 01-26 21-22 rayyan01-set1-iterations10"  # 要读取的结果文件夹路径，例如: "./result/results/gpt-4o-mini 01-26 21-22 rayyan01-set1-iterations10"
    read_distribution_analysis: true  # 是否读取分布分析结果（canonical和error函数）
    read_error_checking: true  # 是否读取LLM标注结果
data:
  base_dir: .
  err_rate_list:
  - '01'
  all_set_num: 1
  datasets:
  - rayyan
  # - beers
  result_dir: results
  err_check_val_num_per_query: 20
